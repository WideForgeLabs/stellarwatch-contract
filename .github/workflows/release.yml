name: Build and Release Contracts

on:
  push:
    tags:
      - 'v*'

permissions:
  id-token: write
  contents: write
  attestations: write

jobs:
  release-contract-registry:
    uses: stellar-expert/soroban-build-workflow/.github/workflows/release.yml@main
    with:
      release_name: ${{ github.ref_name }}
      release_description: 'contract-registry release'
      relative_path: '["contracts/contract-registry"]'
      package: 'contract-registry'
    secrets:
      release_token: ${{ secrets.GITHUB_TOKEN }}

  release-health-registry:
    uses: stellar-expert/soroban-build-workflow/.github/workflows/release.yml@main
    with:
      release_name: ${{ github.ref_name }}
      release_description: 'health-registry release'
      relative_path: '["contracts/health-registry"]'
      package: 'health-registry'
    secrets:
      release_token: ${{ secrets.GITHUB_TOKEN }}

  release-alert-rules:
    uses: stellar-expert/soroban-build-workflow/.github/workflows/release.yml@main
    with:
      release_name: ${{ github.ref_name }}
      release_description: 'alert-rules release'
      relative_path: '["contracts/alert-rules"]'
      package: 'alert-rules'
    secrets:
      release_token: ${{ secrets.GITHUB_TOKEN }}
